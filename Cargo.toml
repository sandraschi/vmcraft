[workspace]
members = [
    "crates/vmcraft-core",
    "crates/vmcraft-mcp",
    "crates/vmcraft-app",
]
resolver = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-std", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
eframe = "0.37"
keyring = "4"
serde_yaml = "0.9"
