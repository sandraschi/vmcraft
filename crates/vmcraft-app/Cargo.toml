[package]
name = "vmcraft-app"
version = "0.1.0"
edition = "2021"
description = "L3 egui desktop app calling vmcraft-core in-process"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vmcraft-app"
path = "src/main.rs"

[dependencies]
vmcraft-core = { path = "../vmcraft-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
eframe = { workspace = true }
keyring = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
